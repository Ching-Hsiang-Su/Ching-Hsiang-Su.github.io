        <script>
            (function() {
                var mediumUsername = '@kmes9940211';
                var mediumProfileUrl = 'https://medium.com/' + mediumUsername;
                var rssUrl = 'https://medium.com/feed/' + mediumUsername;
                var apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);
                var postsContainer = document.getElementById('medium-posts');
                var requestController = window.AbortController ? new AbortController() : null;
                var requestTimeout = window.setTimeout(function() {
                    if (requestController) {
                        requestController.abort();
                    }
                }, 10000);

                function renderMessage(message) {
                    var paragraph = document.createElement('p');
                    paragraph.textContent = message;
                    paragraph.appendChild(document.createTextNode(' '));

                    var profileLink = createExternalLink(mediumProfileUrl);
                    profileLink.textContent = '前往 Medium';
                    paragraph.appendChild(profileLink);

                    postsContainer.classList.remove('posts-ready');
                    postsContainer.replaceChildren(paragraph);
                    postsContainer.setAttribute('aria-busy', 'false');
                }

                function getFirstImage(item) {
                    if (item.thumbnail) {
                        return item.thumbnail;
                    }

                    var html = item.content || item.description || '';
                    var match = html.match(/<img[^>]+src="([^">]+)"/i);
                    return match ? match[1] : '';
                }

                function getSummary(item) {
                    var tmp = document.createElement('div');
                    tmp.innerHTML = item.description || '';
                    var summary = (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();

                    if (summary.length > 150) {
                        return summary.substring(0, 150) + '...';
                    }

                    return summary || '點擊閱讀完整文章。';
                }

                function getSafeUrl(url) {
                    try {
                        var parsedUrl = new URL(url, mediumProfileUrl);
                        return parsedUrl.protocol === 'https:' ? parsedUrl.href : mediumProfileUrl;
                    } catch (error) {
                        return mediumProfileUrl;
                    }
                }

                function getPublishedDate(value) {
                    var date = value ? new Date(value) : null;

                    if (!date || Number.isNaN(date.getTime())) {
                        return null;
                    }

                    return {
                        datetime: date.toISOString(),
                        label: new Intl.DateTimeFormat('zh-TW', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        }).format(date)
                    };
                }

                function createExternalLink(url, className) {
                    var link = document.createElement('a');
                    link.href = getSafeUrl(url);
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';

                    if (className) {
                        link.className = className;
                    }

                    return link;
                }

                fetch(apiUrl, requestController ? { signal: requestController.signal } : {})
                    .then(function(response) {
                        if (!response.ok) {
                            throw new Error('Medium request failed');
                        }

                        return response.json();
                    })
                    .then(function(data) {
                        if (data.status !== 'ok' || !data.items || data.items.length === 0) {
                            renderMessage('目前沒有文章，或暫時無法載入。');
                            return;
                        }

                        var fragment = document.createDocumentFragment();

                        data.items.slice(0, 6).forEach(function(item) {
                            var article = document.createElement('article');
                            article.className = 'post-card';
                            var itemUrl = getSafeUrl(item.link);

                            var title = document.createElement('h3');
                            var titleLink = createExternalLink(itemUrl);
                            titleLink.textContent = item.title || '未命名文章';
                            title.appendChild(titleLink);
                            article.appendChild(title);

                            var publishedDate = getPublishedDate(item.pubDate);
                            if (publishedDate) {
                                var time = document.createElement('time');
                                time.className = 'post-meta';
                                time.dateTime = publishedDate.datetime;
                                time.textContent = publishedDate.label;
                                article.appendChild(time);
                            }

                            var imageUrl = getFirstImage(item);
                            if (imageUrl) {
                                var imageLink = createExternalLink(itemUrl, 'image fit');
                                var image = document.createElement('img');
                                image.src = imageUrl;
                                image.alt = item.title || 'Medium 文章首圖';
                                image.loading = 'lazy';
                                image.decoding = 'async';
                                imageLink.appendChild(image);
                                article.appendChild(imageLink);
                            }

                            var summary = document.createElement('p');
                            summary.textContent = getSummary(item);
                            article.appendChild(summary);

                            var actions = document.createElement('ul');
                            actions.className = 'actions';

                            var actionItem = document.createElement('li');
                            var readMore = createExternalLink(itemUrl, 'button primary');
                            readMore.textContent = '閱讀全文';
                            actionItem.appendChild(readMore);
                            actions.appendChild(actionItem);
                            article.appendChild(actions);

                            fragment.appendChild(article);
                        });

                        postsContainer.classList.add('posts-ready');
                        postsContainer.replaceChildren(fragment);
                        postsContainer.setAttribute('aria-busy', 'false');
                    })
                    .catch(function(error) {
                        renderMessage(error.name === 'AbortError' ? '文章載入時間較長。' : '載入文章時發生錯誤。');
                    })
                    .finally(function() {
                        window.clearTimeout(requestTimeout);
                    });
            })();
        </script>
